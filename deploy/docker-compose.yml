# Run from the project root:
#   docker compose -f deploy/docker-compose.yml up --build
name: cachekit   # fixes the network name to "cachekit_default"

services:
  coordinator:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["coordinator", "-listen", ":8080", "-timeout", "3s"]
    ports: ["8080:8080"]            # curl http://localhost:8080/status
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 10

  node1: &node
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["node", "-id", "node1", "-listen", ":7001", "-advertise", "node1:7001", "-coordinator", "http://coordinator:8080"]
    ports: ["7001:7001"]            # for redis-cli / redis-benchmark from the host
    depends_on:
      coordinator: { condition: service_healthy }
    restart: "no"                   # so `docker stop node2` really simulates a dead node

  node2:
    <<: *node
    command: ["node", "-id", "node2", "-listen", ":7001", "-advertise", "node2:7001", "-coordinator", "http://coordinator:8080"]
    ports: ["7002:7001"]

  node3:
    <<: *node
    command: ["node", "-id", "node3", "-listen", ":7001", "-advertise", "node3:7001", "-coordinator", "http://coordinator:8080"]
    ports: ["7003:7001"]

  # ---- demo application: product catalog (cache-aside over the cluster) ----
  postgres:
    build: ./postgres                 # postgres:16 + schema and 1000 seed products
    environment:
      POSTGRES_USER: cachekit
      POSTGRES_PASSWORD: cachekit
      POSTGRES_DB: catalog
    ports: ["5433:5432"]              # 5433 so it does not clash with a Postgres already on your machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cachekit -d catalog"]
      interval: 2s
      timeout: 2s
      retries: 20
    # No volume: `docker compose down` resets the data to the seed.

  demo:
    build: { context: .., dockerfile: deploy/Dockerfile }
    # DB_LATENCY adds a simulated network delay to every database call (see the load-test
    # section of the README). Default 0s = the real, local Postgres latency.
    # BREAKER_THRESHOLD=0 turns the client's per-node circuit breaker off (for before/after tests).
    command: ["demo", "-listen", ":9090", "-simulate-db-latency", "${DB_LATENCY:-0s}", "-breaker-threshold", "${BREAKER_THRESHOLD:-3}"]
    environment:
      DATABASE_URL: postgres://cachekit:cachekit@postgres:5432/catalog?sslmode=disable
      COORDINATOR_URL: http://coordinator:8080
    ports: ["9090:9090"]              # curl -i http://localhost:9090/products/42
    depends_on:
      coordinator: { condition: service_healthy }
      postgres: { condition: service_healthy }
      node1: { condition: service_started }
      node2: { condition: service_started }
      node3: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: "no"

  # Same app and database but NO cache (no COORDINATOR_URL): the baseline for load tests.
  # Not started by `up`; start it with:  docker compose -f deploy/docker-compose.yml --profile bench up -d
  demo-nocache:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["demo", "-listen", ":9090", "-simulate-db-latency", "${DB_LATENCY:-0s}"]
    environment:
      DATABASE_URL: postgres://cachekit:cachekit@postgres:5432/catalog?sslmode=disable
    ports: ["9091:9090"]              # curl -i http://localhost:9091/products/42   (never a cache hit)
    profiles: ["bench"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Not started by `up`. Run it inside the compose network so it can resolve
  # node1/node2/node3:   docker compose -f deploy/docker-compose.yml run --rm cachectl fill 10000
  cachectl:
    build: { context: .., dockerfile: deploy/Dockerfile }
    entrypoint: ["cachectl", "-coordinator", "http://coordinator:8080"]
    profiles: ["tools"]
    depends_on:
      coordinator: { condition: service_healthy }
